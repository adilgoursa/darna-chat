name: Build APK
on:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: cd ChatApp && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: ChatApp/app/build/outputs/apk/debug/app-debug.apk
